<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scène 3D</title>
<style>
  :root { --bg: #f6f5f2; --text: #1f1e1c; --muted: #77746d; --line: #e4e1da; --accent: #d97757; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1b1b1a; --text: #ecebe7; --muted: #9b988f; --line: #363532; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
  #scene { position: relative; width: 100%; height: 100vh; min-height: 360px; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
  .titre { position: absolute; left: 24px; top: 20px; pointer-events: none; }
  .titre h1 { margin: 0; font-size: 22px; font-weight: 600; }
  .titre p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .calque { position: absolute; inset: 0; pointer-events: none; }
  .etiquette { font-size: 12px; font-weight: 600; color: var(--text); background: color-mix(in srgb, var(--bg) 82%, transparent);
    border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; white-space: nowrap; transform: translateY(-14px); }
  .repli { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); text-align: center; padding: 24px; }
</style>
<!-- three.js : une version fixe (jamais « latest »), le module et ses extensions depuis le même endroit -->
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="scene" role="img" aria-label="Un nœud torique qui tourne lentement ; glisser pour le faire pivoter">
  <div class="titre"><h1>Scène 3D</h1><p>Glisse pour tourner, molette ou pincement pour zoomer</p></div>
</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

const box = document.getElementById("scene");
const calme = matchMedia("(prefers-reduced-motion: reduce)").matches;   // pas de rotation automatique si l'utilisateur le demande

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true })  // l'image reste lisible (captures);
} catch (e) {
  box.insertAdjacentHTML("beforeend", '<div class="repli">La 3D n\'est pas disponible dans ce navigateur (WebGL désactivé).</div>');
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));                  // net sans écraser la carte graphique (écrans Retina)
renderer.outputColorSpace = THREE.SRGBColorSpace;
box.prepend(renderer.domElement);
const calque = new CSS2DRenderer();                                     // les noms des parties, posés sur la 3D
calque.domElement.className = "calque";
box.append(calque.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.set(0, 1.2, 6);

// lumières : une douce partout + une principale qui fait le relief
scene.add(new THREE.HemisphereLight(0xffffff, 0x444455, 1.1));
const soleil = new THREE.DirectionalLight(0xffffff, 2.2);
soleil.position.set(3, 4, 5);
scene.add(soleil);

// TOUT ce qu'on dessine va dans « monde » : il est centré et cadré d'un coup, quelle que soit sa taille
const monde = new THREE.Group();
scene.add(monde);

// le nom d'une partie, accroché à elle (il la suit quand elle tourne) : etiquette("Aorte", aorte)
// ou à un point du monde : etiquette("Salon", new THREE.Vector3(2, 1, 3))
function etiquette(texte, ou) {
  const div = document.createElement("span");
  div.className = "etiquette"; div.textContent = texte;
  const nom = new CSS2DObject(div);
  if (ou && ou.isObject3D) ou.add(nom); else { nom.position.copy(ou || new THREE.Vector3()); monde.add(nom); }
  return nom;
}

// ---- la scène : remplace seulement ce bloc ----
const objet = new THREE.Mesh(
  new THREE.TorusKnotGeometry(1.1, 0.34, 220, 32),
  new THREE.MeshStandardMaterial({ color: 0xd97757, roughness: 0.35, metalness: 0.15 })
);
monde.add(objet);
etiquette("Nœud torique", objet);
// ---- fin de la scène ----

const controles = new OrbitControls(camera, renderer.domElement);
controles.enableDamping = true;            // le mouvement s'arrête en douceur

// centre l'objet sur l'origine et recule la caméra pour qu'il remplisse la vue (un objet de 40 unités comme de 0,5)
function cadrer(groupe) {
  const boite = new THREE.Box3().setFromObject(groupe);
  if (boite.isEmpty()) return;
  const centre = boite.getCenter(new THREE.Vector3());
  groupe.children.forEach((c) => c.position.sub(centre));
  const rayon = boite.getBoundingSphere(new THREE.Sphere()).radius;
  const distance = rayon / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.1;
  camera.position.set(0, rayon * 0.35, distance);
  camera.near = distance / 100; camera.far = distance * 10;
  camera.updateProjectionMatrix();
  controles.target.set(0, 0, 0);
  controles.minDistance = distance * 0.4; controles.maxDistance = distance * 3;
}
cadrer(monde);

// vérification : ce qui est invisible, minuscule ou hors champ est signalé dans la console (lue avant de dire « fini »)
function verifier() {
  monde.updateMatrixWorld(true); camera.updateMatrixWorld();   // positions à jour avant de mesurer
  monde.traverse((o) => {
    const g = o.isMesh && o.geometry;
    if (g && ((g.index && g.index.count === 0) || !g.attributes.position || g.attributes.position.count < 3))
      console.error(`Objet 3D vide (géométrie ${g.type} sans triangles) : vérifie l'ordre de ses paramètres.`);
  });
  const boite = new THREE.Box3().setFromObject(monde);
  if (boite.isEmpty()) return console.error("Rien à voir : la scène 3D est vide.");
  const coins = [];
  for (const x of [boite.min.x, boite.max.x]) for (const y of [boite.min.y, boite.max.y]) for (const z of [boite.min.z, boite.max.z])
    coins.push(new THREE.Vector3(x, y, z).project(camera));
  const dedans = coins.filter((v) => Math.abs(v.x) <= 1 && Math.abs(v.y) <= 1 && v.z < 1);
  const w = Math.min(1, Math.max(...coins.map((v) => v.x))) - Math.max(-1, Math.min(...coins.map((v) => v.x)));
  const h = Math.min(1, Math.max(...coins.map((v) => v.y))) - Math.max(-1, Math.min(...coins.map((v) => v.y)));
  if (!dedans.length) console.error("L'objet 3D est hors du champ de la caméra : appelle cadrer(monde) après l'avoir construit.");
  else if (w * h < 0.04) console.error("L'objet 3D est minuscule à l'écran : appelle cadrer(monde) après l'avoir construit.");
}

// la taille suit le conteneur (fenêtre, panneau, rotation du téléphone)
function taille() {
  const w = box.clientWidth, h = box.clientHeight;
  renderer.setSize(w, h, false);
  calque.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(taille).observe(box);
taille();
verifier();
calque.render(scene, camera);
renderer.render(scene, camera);   // une première image tout de suite : visible dans une capture, même sans animation

const temps = new THREE.Timer();           // (three.js signale THREE.Clock comme dépassé)
renderer.setAnimationLoop((t) => {         // s'arrête tout seul quand l'onglet est caché
  temps.update(t);
  const dt = temps.getDelta();
  if (!calme) monde.rotation.y += dt * 0.35;   // une rotation lente autour de l'axe vertical : l'objet reste au centre
  controles.update();
  renderer.render(scene, camera);
  calque.render(scene, camera);
  window.__images = (window.__images || 0) + 1;   // compteur d'images dessinées (vérification)
});

// en quittant la page : tout est libéré (mémoire de la carte graphique)
addEventListener("pagehide", () => {
  renderer.setAnimationLoop(null);
  monde.traverse((o) => { o.geometry?.dispose(); [].concat(o.material || []).forEach((m) => m.dispose()); });
  renderer.dispose();
});
</script>
</body>
</html>
